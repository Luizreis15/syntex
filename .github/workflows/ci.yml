name: CI

on:
  push:
    branches: [main, operational-core-v1]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      # npm optionalDeps + lock gerado em macOS às vezes omite o binário linux do rollup.
      - name: Rollup native (linux)
        run: npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (sem Supabase)
        run: npm run test:unit
